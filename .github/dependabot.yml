version: 2
updates:
  # The root covers every package of the Bun workspace.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      effect:
        patterns: ["effect", "@effect/*"]
      tooling:
        patterns: ["@commitlint/*", "lefthook", "oxfmt", "oxlint", "turbo"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    commit-message:
      prefix: ci
    labels: [dependencies]
