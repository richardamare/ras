name: release

# A pushed tag vX.Y.Z publishes the GitHub release for the master commit it points at, then deploys it to Cloud Run.
# A version with a suffix, such as v1.2.0-rc.1, publishes a prerelease that never becomes the latest release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        run: |
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a semantic version tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$tag points at $GITHUB_SHA, which is not on master"
            exit 1
          fi
          manifest=$(jq -r .version package.json)
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::$tag does not match the version $manifest in package.json"
            exit 1
          fi

          # A stable release lists the changes since the previous stable release; a prerelease, since any release.
          if [[ "$version" == *-* ]]; then
            prerelease=true
            candidates='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          else
            prerelease=false
            candidates='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          previous_tag=$(git -c versionsort.suffix=- tag --list 'v*' --merged "$GITHUB_SHA" --sort=-v:refname \
            | grep -E "$candidates" | grep -vxF "$tag" | head -1 || true)

          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

  checks:
    needs: preflight
    # A called workflow gets no more than its caller grants, and ci.yml's PR-only changes job asks for pull-requests.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "ras $TAG" --generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then args+=(--notes-start-tag "$PREVIOUS_TAG"); fi
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$TAG" "${args[@]}"

  deploy:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
