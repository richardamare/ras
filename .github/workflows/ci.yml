name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - run: bun run fmt:check
      - run: bun x turbo run typecheck lint test build
        env:
          VITE_ENVIRONMENT: production

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - run: bun run --cwd apps/e2e e2e:install
      - run: bun x turbo run e2e
        env:
          VITE_ENVIRONMENT: production

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # The ruleset requires only this job, so adding or renaming a job above never touches repository settings.
  ci-ok:
    needs: [check, e2e, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
